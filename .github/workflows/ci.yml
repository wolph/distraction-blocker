name: Extension quality

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint, typecheck, test and build extension
        run: npm run check
      - name: Validate QA checklist
        run: npm run qa:validate
      - name: Package the checked build
        # npm run check already builds dist. Reuse it to validate and create the ZIP.
        run: node scripts/validate-store-package.mjs --zip
      - name: Validate release package
        run: npm run store:validate
      - name: Build and validate privacy policy
        run: npm run pages:validate
