name: Extension quality

on:
  push:
    branches:
      - master
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint, typecheck, test and build extension
        run: npm run check
      - name: Verify Chrome injection messages against Chromium source
        # The registration sweep recognises Chrome refusals by message text. A renamed message in
        # Chromium would turn a harmless refusal into a reported one, so the text is pinned to
        # Chromium main.
        run: npm run chrome:messages
      - name: Validate QA checklist
        run: npm run qa:validate
      - name: Package the checked build
        # npm run check already builds dist. Reuse it to validate and create the ZIP.
        run: node scripts/validate-store-package.mjs --zip
      - name: Validate release package
        run: npm run store:validate
      - name: Build and validate privacy policy
        run: npm run pages:validate
      - name: Upload the store package
        uses: actions/upload-artifact@v6
        with:
          name: store-package
          path: release/
          if-no-files-found: error

  browser:
    # The unit suite mocks Chrome, so a real Chrome refusal never reaches it. This job runs the
    # Playwright suite against the packaged build in a real browser, which is the only place a
    # production defect of that kind can show up before the store does.
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Package the build under test
        # The suite loads the extension from the packaged output, as npm run e2e does.
        run: npm run store:package
      - name: Run the browser suite
        env:
          NO_COLOR: '1'
          # The store screenshot scenarios belong to the release gate: see playwright.config.ts.
          FOCUS_LOCK_SKIP_RELEASE_CAPTURES: '1'
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - name: Upload traces and profiles from failed scenarios
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-failures-shard-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
